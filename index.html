<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nasdaq Composite · &gt;10% drawdowns since 2000</title>
<meta name="description" content="Every Nasdaq Composite peak-to-trough decline of more than 10% since 2000. 200 DMA at the bottom, cause, macro, duration.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3f3f1;
    --ink: #1a1a1a;
    --muted: #5c5c56;
    --gold: #c4a000;
    --line: #d4d4ce;
    --blood: #8b1e1e;
    --ok: #2c4a2c;
    --card: #fffcf7;
    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 16px;
    --space-lg: 24px;
    --space-xl: 48px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-family: "Space Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  a { color: var(--ink); }
  header {
    padding: 28px 20px 0;
    max-width: 720px;
    margin: 0 auto;
  }
  .kicker {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
  }
  h1 {
    font-size: clamp(28px, 7vw, 42px);
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin: 8px 0 12px;
    max-width: 18ch;
  }
  .lede {
    color: var(--muted);
    max-width: 62ch;
    margin: 0 0 20px;
  }
  .now {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 20px;
    padding: 16px 0;
    border-top: 2px solid var(--ink);
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
  }
  .now dt {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
  }
  .now dd {
    margin: 2px 0 0;
    font-size: 18px;
    font-weight: 700;
  }
  .now dd.neg { color: var(--blood); }
  .now dd.pos { color: var(--ok); }
  .method {
    font-size: 14px;
    color: var(--muted);
    max-width: 62ch;
    margin: 0 0 24px;
  }
  .chart-wrap {
    margin: 8px 0 28px;
  }
  .chart-wrap svg { width: 100%; height: auto; display: block; }
  .chart-cap {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 0 0 12px;
  }
  .filters button {
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
    padding: 8px 12px;
    cursor: pointer;
  }
  .filters button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--paper);
  }
  .count {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 28px;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px 64px;
  }
  .cycle {
    margin: 36px 0 16px;
    padding-top: 16px;
    border-top: 2px solid var(--ink);
  }
  .cycle h2 {
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  .cycle p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    max-width: 62ch;
  }
  .cycle .num { color: var(--blood); font-weight: 700; }
  article.ep {
    padding: 28px 0;
    border-bottom: 1px solid var(--line);
  }
  article.ep .drop {
    font-size: clamp(36px, 9vw, 52px);
    line-height: 0.95;
    font-weight: 700;
    color: var(--blood);
    letter-spacing: -0.03em;
    margin: 0 0 4px;
  }
  article.ep h3 {
    font-size: 20px;
    line-height: 1.2;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
    max-width: 28ch;
  }
  .when {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 16px;
  }
  .facts {
    display: grid;
    grid-template-columns: 9.5em 1fr;
    gap: 6px 12px;
    margin: 0 0 18px;
    max-width: 42em;
  }
  .facts dt {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
    padding-top: 2px;
  }
  .facts dd {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
  }
  .facts dd.below { color: var(--blood); }
  .facts dd.above { color: var(--ok); }
  .blurb h4 {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 14px 0 4px;
    font-weight: 600;
  }
  .blurb p {
    margin: 0;
    max-width: 62ch;
    font-size: 15px;
  }
  .near {
    margin-top: 48px;
    padding-top: 16px;
    border-top: 2px solid var(--ink);
  }
  .near h2 {
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin: 0 0 12px;
  }
  .near li {
    margin: 0 0 12px;
    max-width: 62ch;
  }
  footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px 48px;
    color: var(--muted);
    font-size: 13px;
  }
  @media (min-width: 720px) {
    header, main, footer { padding-left: 32px; padding-right: 32px; }
    .now { grid-template-columns: repeat(4, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<header>
  <div class="kicker">Correction log · Composite · daily close</div>
  <h1>Nasdaq, every &gt;10% drawdown since 2000</h1>
  <p class="lede" id="lede"></p>
  <dl class="now" id="now"></dl>
  <p class="method" id="method"></p>
  <div class="chart-wrap">
    <svg id="chart" viewBox="0 0 720 160" role="img" aria-label="Nasdaq Composite weekly closes since 2000, log scale, drawdown windows shaded"></svg>
    <p class="chart-cap">Weekly close, log scale. Shaded bands are the &gt;10% episodes below.</p>
  </div>
</header>
<main>
  <div class="filters" role="group" aria-label="Filter episodes">
    <button type="button" data-f="all" aria-pressed="true">All</button>
    <button type="button" data-f="bear">Bears ≥20%</button>
    <button type="button" data-f="corr">10–20%</button>
    <button type="button" data-f="below">Bottomed below 200 DMA</button>
  </div>
  <p class="count" id="count"></p>
  <div id="log"></div>
  <section class="near" id="near"></section>
</main>
<footer id="foot"></footer>
<script src="data.js"></script>
<script>
(function () {
  const D = window.NDXDD;
  const fmt = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
  const pct = (n, d) => {
    const v = Math.abs(n).toFixed(d ?? 1);
    return (n < 0 ? "−" : n > 0 ? "+" : "") + v + "%";
  };

  document.getElementById("lede").textContent =
    D.episodes.length + " peak-to-trough declines of more than 10% on the Composite. Nested legs inside a larger bear are listed separately — each had its own cause.";

  const last = D.last;
  document.getElementById("now").innerHTML = [
    ["Last close", fmt.format(last.close), ""],
    ["Vs 6 Oct 2026 high", pct(last.vs_ath), last.vs_ath < 0 ? "neg" : "pos"],
    ["Vs 200 DMA", pct(last.vs_sma200), last.vs_sma200 < 0 ? "neg" : "pos"],
    ["As of", last.date, ""]
  ].map(([k, v, c]) => `<div><dt>${k}</dt><dd class="num ${c}">${v}</dd></div>`).join("");

  document.getElementById("method").textContent = D.method;

  drawChart(D);

  const log = document.getElementById("log");
  const buttons = document.querySelectorAll(".filters button");
  let filter = "all";

  function pass(e) {
    if (filter === "bear") return e.dd_pct <= -20;
    if (filter === "corr") return e.dd_pct > -20;
    if (filter === "below") return e.below_200dma;
    return true;
  }

  function render() {
    const rows = D.episodes.filter(pass).slice().reverse();
    document.getElementById("count").textContent =
      rows.length + " of " + D.episodes.length + " episodes · newest first";
    log.innerHTML = "";
    let lastCycle = null;
    const seen = new Set();
    rows.forEach((e) => {
      if (e.cycle && !seen.has(e.cycle)) {
        seen.add(e.cycle);
        const c = D.cycles[e.cycle];
        const h = document.createElement("div");
        h.className = "cycle";
        h.innerHTML = `<h2>${c.label} · ${c.span}</h2><p><span class="num">${pct(c.dd)}</span> cycle. ${c.note}</p>`;
        log.appendChild(h);
        lastCycle = e.cycle;
      }
      log.appendChild(card(e));
    });
  }

  function card(e) {
    const el = document.createElement("article");
    el.className = "ep";
    const dmaClass = e.below_200dma ? "below" : "above";
    const fed = e.fed_peak === e.fed_trough
      ? e.fed_trough
      : e.fed_peak + " → " + e.fed_trough;
    const yld = (e.tnx_peak != null && e.tnx_trough != null)
      ? e.tnx_peak.toFixed(2) + "% → " + e.tnx_trough.toFixed(2) + "%"
      : "—";
    const cpi = (e.cpi_peak != null && e.cpi_trough != null)
      ? (e.cpi_peak === e.cpi_trough
          ? e.cpi_trough.toFixed(1) + "%"
          : e.cpi_peak.toFixed(1) + "% → " + e.cpi_trough.toFixed(1) + "%")
      : "—";
    el.innerHTML = `
      <div class="drop num">${pct(e.dd_pct)}</div>
      <h3>${e.name}</h3>
      <p class="when">${e.peak_month} → ${e.trough_month} · ${e.duration}<br>
        <span class="num">${fmt.format(e.peak)}</span> → <span class="num">${fmt.format(e.trough)}</span>
      </p>
      <dl class="facts">
        <dt>Bottomed</dt><dd>${e.trough_month}</dd>
        <dt>Length</dt><dd>${e.duration}</dd>
        <dt>200 DMA at low</dt><dd class="${dmaClass}">${e.dma_label}</dd>
        <dt>Fed funds</dt><dd class="num">${fed}</dd>
        <dt>10-year</dt><dd class="num">${yld}</dd>
        <dt>CPI YoY</dt><dd class="num">${cpi}</dd>
      </dl>
      <div class="blurb">
        <h4>What caused it</h4>
        <p>${e.cause}</p>
        <h4>What caused the bottom</h4>
        <p>${e.bottom}</p>
      </div>`;
    return el;
  }

  buttons.forEach((b) => {
    b.addEventListener("click", () => {
      filter = b.dataset.f;
      buttons.forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      render();
      window.scrollTo({ top: document.getElementById("count").offsetTop - 12, behavior: "smooth" });
    });
  });
  render();

  document.getElementById("near").innerHTML =
    "<h2>Near misses, not in the log</h2><ul>" +
    D.near_misses.map((n) => `<li><strong>${n.label}.</strong> ${n.detail}</li>`).join("") +
    "</ul>";

  document.getElementById("foot").innerHTML =
    "Source: Nasdaq Composite daily closes via Yahoo Finance (^IXIC), 1998–" + last.date +
    ". 200-session simple moving average at the trough close. Fed funds target from FOMC effective dates. 10-year from ^TNX. CPI-U YoY from BLS. Built " + last.date + ".";

  function drawChart(D) {
    const svg = document.getElementById("chart");
    const w = 720, h = 160, pad = { l: 8, r: 8, t: 8, b: 18 };
    const series = D.weekly;
    const xs = series.map((p) => Date.parse(p.d));
    const ys = series.map((p) => Math.log(p.c));
    const x0 = xs[0], x1 = xs[xs.length - 1];
    const y0 = Math.min(...ys), y1 = Math.max(...ys);
    const X = (t) => pad.l + (t - x0) / (x1 - x0) * (w - pad.l - pad.r);
    const Y = (v) => pad.t + (1 - (v - y0) / (y1 - y0)) * (h - pad.t - pad.b);
    let bands = "";
    D.episodes.forEach((e) => {
      const a = X(Date.parse(e.peak_date));
      const b = X(Date.parse(e.trough_date));
      bands += `<rect x="${a.toFixed(1)}" y="${pad.t}" width="${Math.max(1.2, b - a).toFixed(1)}" height="${h - pad.t - pad.b}" fill="rgba(139,30,30,0.14)"/>`;
    });
    let d = "";
    series.forEach((p, i) => {
      const cmd = i ? "L" : "M";
      d += `${cmd}${X(Date.parse(p.d)).toFixed(1)},${Y(Math.log(p.c)).toFixed(1)} `;
    });
    const ticks = [2000, 2005, 2010, 2015, 2020, 2025];
    const labels = ticks.map((y) => {
      const x = X(Date.parse(y + "-01-01"));
      return `<text x="${x.toFixed(1)}" y="${h - 2}" text-anchor="middle" font-size="10" font-family="Space Mono,monospace" fill="#5c5c56">${y}</text>`;
    }).join("");
    svg.innerHTML = bands + `<path d="${d}" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>` + labels;
  }
})();
</script>
</body>
</html>
